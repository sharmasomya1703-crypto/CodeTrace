services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CODETRACE_ENABLE_EVAL: "true"
      CODETRACE_RUNNER: subprocess
      CODETRACE_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
      CODETRACE_DEFAULT_TIMEOUT: "2"
      CODETRACE_MAX_OUTPUT_BYTES: "64000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
